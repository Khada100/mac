name: Android APK 빌드

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # 최신 APK 를 릴리스에 올리기 위해
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v5

      - name: JDK 17 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 디버그 APK 빌드
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: APK 내용 확인
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$AAPT2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|application-label|native-code)"
          unzip -l "$APK" | grep -E "lib/.*\.so|classes.*\.dex"

      - name: APK 업로드 (Actions 아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: ImageMacro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 최신 APK 릴리스 갱신 (폰에서 바로 받기용)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ImageMacro.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ImageMacro.apk \
            --target "$GITHUB_SHA" \
            --title "최신 APK (${GITHUB_REF_NAME} · ${GITHUB_SHA::7})" \
            --notes "폰 브라우저에서 아래 ImageMacro.apk 를 눌러 내려받고 설치하세요. 설치 후 사용법은 README 참고."

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v5

      - name: 빌드된 APK 받기
        uses: actions/download-artifact@v4
        with:
          name: ImageMacro-debug-apk
          path: apk

      - name: Python + Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow

      - name: KVM 활성화 (에뮬레이터 가속)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 에뮬레이터에서 실제 동작 테스트 (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/e2e.sh
